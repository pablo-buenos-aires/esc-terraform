[SERVICE]
    Flush         1
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# FireLens (awsfirelens) отправляет логи сюда:
# - unix socket: /var/run/fluent.sock
# - tcp forward: 24224
[INPUT]
    Name          forward
    unix_path     /var/run/fluent.sock

# Вывод логов в CloudWatch Logs
[OUTPUT]
    Name                cloudwatch_logs
    Match               *
    region              sa-east-1
    log_group_name      /ecs/backend
    log_stream_prefix   app-
    auto_create_group   true
    log_key             log

# Prometheus endpoint: http://<ip>:2021/metrics
[OUTPUT]
    Name          prometheus_exporter
    Match         *
    Host          0.0.0.0
    Port          2021
